# Personal fork; change the existing stack only after backup and image verification.
# Explicit external names prevent accidental creation of empty replacement volumes.
services:
  hermes-studio:
    image: ${AGENT_STUDIO_IMAGE:?Set the verified personal image tag or digest}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    runtime: ${STUDIO_RUNTIME:-sysbox-runc}
    container_name: hermes-main
    restart: unless-stopped
    stdin_open: true
    tty: true
    labels:
      caddy: ${AGENT_STUDIO_HOST:-hermes.i3u.us}
      caddy.0_handle: /webhooks/*
      caddy.0_handle.0_reverse_proxy: "{{upstreams 8644}}"
      caddy.1_handle: ""
      caddy.1_handle.0_reverse_proxy: "{{upstreams 6060}}"
    environment:
      PORT: "6060"
      HERMES_HOME: /home/agent/.hermes
      HERMES_BIN: /opt/hermes/.venv/bin/hermes
      HERMES_WEB_UI_HOME: /home/agent/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: /home/agent/.hermes-web-ui
      HERMES_WEB_UI_MANAGED_GATEWAY: "1"
      HERMES_WEB_UI_AUTH_JWT_EXPIRES_IN: "30d"
      HERMES_WEB_UI_XAI_CALLBACK_BIND_HOST: 0.0.0.0
      HERMES_WEB_UI_DISABLE_UPDATE_CHECK: "1"
      HERMES_LAN_ADVERTISE_URL: https://${AGENT_STUDIO_HOST:-hermes.i3u.us}
      NPM_CONFIG_PREFIX: /home/agent/.hermes-web-ui/coding-agent/npm
      PATH: /home/agent/.hermes-web-ui/coding-agent/npm/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HERMES_ALLOW_ROOT_GATEWAY: "1"
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-218369077}
      TZ: ${TZ:-Asia/Riyadh}
    volumes:
      - hermes-data:/home/agent/.hermes
      - hermes-webui-data:/home/agent/.hermes-web-ui
    networks: [default, proxy]

networks:
  default: {}
  proxy:
    external: true

volumes:
  hermes-data:
    external: true
    name: ${HERMES_DATA_VOLUME:?Set the exact existing Hermes volume name}
  hermes-webui-data:
    external: true
    name: ${HERMES_WEBUI_DATA_VOLUME:?Set the exact existing Studio volume name}
