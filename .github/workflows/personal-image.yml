name: Personal Core Hub image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed source branch or tag (CI must have passed for its exact commit)
        default: main
        required: true
        type: string
      verify_only:
        description: Pull and smoke-test an already published image without rebuilding or publishing
        default: false
        required: false
        type: boolean
      promote_latest:
        description: Also promote the verified existing image to latest when verify_only is selected
        default: false
        required: false
        type: boolean
      publish_latest:
        description: Promote a freshly built image to latest (disable to publish only the sha tag, e.g. a branch preview for a test stack)
        default: true
        required: false
        type: boolean
      preview_tag:
        description: Optional extra moving tag for the freshly built image (e.g. test); never latest
        default: ""
        required: false
        type: string
      image_repo:
        description: GHCR package to publish to. core-hub is the public deployment image; core-hub-test is the owner's private test track.
        default: core-hub
        required: false
        type: choice
        options:
          - core-hub
          - core-hub-test

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: personal-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # Both names are allowed during the owner-controlled repository rename.
    # Owner-approved new GHCR package; existing data mounts remain unchanged.
    if: github.repository == 'twuijri/agent-studio' || github.repository == 'twuijri/core-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Resolve immutable source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refuse to promote the test-track package to latest
        if: ${{ inputs.image_repo != 'core-hub' && (inputs.publish_latest || inputs.promote_latest) }}
        run: |
          echo "::error::latest is reserved for the public core-hub package; the test track never publishes latest." >&2
          exit 1
      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const runs = JSON.parse(execFileSync('gh', ['run', 'list', '--repo', process.env.GITHUB_REPOSITORY,
            '--commit', process.env.SOURCE_SHA, '--limit', '100', '--json', 'databaseId,workflowName,status,conclusion'], {encoding: 'utf8'}));
          for (const name of ['Build', 'Playwright', 'Personal fork license']) {
            const run = runs.filter(r => r.workflowName === name).sort((a,b) => b.databaseId-a.databaseId)[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error(`${name} must succeed for this commit before image publication. Wait for CI or fix it, then dispatch again.`);
            }
          }
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Report the image package visibility
        # The source repository became public on 2026-09-18 and the owner made
        # the deployment image public on 2026-09-19 so users can pull it without
        # a token. Visibility is reported, never enforced, from here on.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const headers = {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'};
          const pkg = await fetch('https://api.github.com/users/twuijri/packages/container/${{ inputs.image_repo }}', {headers});
          if (pkg.status === 404) console.log('No existing package yet; GHCR packages start private until the owner changes their visibility.');
          else if (!pkg.ok) console.log(`Package visibility could not be read (HTTP ${pkg.status}).`);
          else console.log(`Existing package visibility: ${(await pkg.json()).visibility}`);
          NODE
      - name: Verify license and personal safeguards
        run: |
          node scripts/check-personal-license.mjs
          node --test tests/personal/*.test.mjs
      - uses: docker/setup-buildx-action@v3
        if: ${{ !inputs.verify_only }}
      - name: Build the deployment image
        if: ${{ !inputs.verify_only }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/twuijri/${{ inputs.image_repo }}:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.licenses=BSL-1.1
      - name: Smoke-test the same image before publishing
        if: ${{ !inputs.verify_only }}
        run: node scripts/smoke-personal-image.mjs ghcr.io/twuijri/${{ inputs.image_repo }}:sha-${{ steps.source.outputs.sha }} --install-agents
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: ${{ !inputs.verify_only }}
        env:
          IMAGE: ghcr.io/twuijri/${{ inputs.image_repo }}:sha-${{ steps.source.outputs.sha }}
        run: |
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.publish_latest }}" != "true" ]; then
            printf 'Preview image only: latest was NOT updated (source %s).\n' "${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Pull and verify the published image from the registry
        if: ${{ inputs.verify_only }}
        env:
          IMAGE: ghcr.io/twuijri/${{ inputs.image_repo }}:sha-${{ steps.source.outputs.sha }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          docker pull "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          node scripts/smoke-personal-image.mjs "$IMAGE" --install-agents
      - name: Report the published image package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const headers = {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'};
          const response = await fetch('https://api.github.com/users/twuijri/packages/container/${{ inputs.image_repo }}', {headers});
          if (!response.ok) { console.log(`Package visibility could not be read (HTTP ${response.status}).`); }
          else {
            const visibility = (await response.json()).visibility;
            console.log(`Published package visibility: ${visibility}`);
            const expected = '${{ inputs.image_repo }}' === 'core-hub' ? 'public' : 'private';
            if (visibility !== expected) console.log(`::warning::The ${'${{ inputs.image_repo }}'} package is ${visibility}; expected ${expected}. Change it under Package settings → Danger zone.`);
          }
          NODE
      - name: Tag the published image with the preview tag
        if: ${{ !inputs.verify_only && inputs.preview_tag != '' }}
        env:
          IMAGE: ghcr.io/twuijri/${{ inputs.image_repo }}:sha-${{ steps.source.outputs.sha }}
          PREVIEW_TAG: ${{ inputs.preview_tag }}
        run: |
          case "$PREVIEW_TAG" in
            latest|main|sha-*) echo "preview_tag must not be latest, main or a sha tag" >&2; exit 1 ;;
          esac
          printf '%s' "$PREVIEW_TAG" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,63}$' || { echo "invalid preview_tag" >&2; exit 1; }
          PREVIEW="ghcr.io/twuijri/${{ inputs.image_repo }}:$PREVIEW_TAG"
          expected_digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          docker tag "$IMAGE" "$PREVIEW"
          docker push "$PREVIEW"
          docker pull "$PREVIEW"
          actual_digest=$(docker image inspect "$PREVIEW" --format '{{index .RepoDigests 0}}')
          test "$actual_digest" = "$expected_digest"
          printf 'Preview tag %s points to %s\n' "$PREVIEW_TAG" "$actual_digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Promote the tested image to latest
        if: ${{ (!inputs.verify_only && inputs.publish_latest) || (inputs.verify_only && inputs.promote_latest) }}
        env:
          IMAGE: ghcr.io/twuijri/${{ inputs.image_repo }}:sha-${{ steps.source.outputs.sha }}
          LATEST: ghcr.io/twuijri/${{ inputs.image_repo }}:latest
        run: |
          expected_digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          docker tag "$IMAGE" "$LATEST"
          docker push "$LATEST"
          docker pull "$LATEST"
          actual_digest=$(docker image inspect "$LATEST" --format '{{index .RepoDigests 0}}')
          test "$actual_digest" = "$expected_digest"
          printf 'Verified latest points to %s\n' "$actual_digest" >> "$GITHUB_STEP_SUMMARY"
