name: Personal Agent Studio image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: personal-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'twuijri/agent-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const runs = JSON.parse(execFileSync('gh', ['run', 'list', '--repo', process.env.GITHUB_REPOSITORY,
            '--commit', process.env.GITHUB_SHA, '--limit', '100', '--json', 'databaseId,workflowName,status,conclusion'], {encoding: 'utf8'}));
          for (const name of ['Build', 'Playwright', 'Personal fork license']) {
            const run = runs.filter(r => r.workflowName === name).sort((a,b) => b.databaseId-a.databaseId)[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error(`${name} must succeed for this commit before image publication. Wait for CI or fix it, then dispatch again.`);
            }
          }
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify license and personal safeguards
        run: |
          node scripts/check-personal-license.mjs
          node --test tests/personal/*.test.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Build the deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/twuijri/agent-studio:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/twuijri/agent-studio
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BSL-1.1
      - name: Smoke-test the same image before publishing
        run: node scripts/smoke-personal-image.mjs ghcr.io/twuijri/agent-studio:sha-${{ github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          IMAGE: ghcr.io/twuijri/agent-studio:sha-${{ github.sha }}
        run: |
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
