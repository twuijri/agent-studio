name: Personal fork license
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-personal-license.mjs
      - run: node --test tests/personal/*.test.mjs
