name: Test track

# Owner-only test builds from the `test` branch, kept apart from releases:
#   * desktop apps named "Core Hub Test" (own app id and data folder, version
#     <pkg>-test.<run>) uploaded as private workflow artifacts — never a release;
#   * the deployment image published to the private package
#     ghcr.io/twuijri/core-hub-test with the moving tag `test`.
# Runs after Playwright succeeds on `test`, so CI is green before anything is
# built; nothing here touches main, releases, or the public core-hub package.
# The finished apps are also published to the owner's private repository
# twuijri/core-hub-test-builds as the single rolling release `latest-test`
# (https://github.com/twuijri/core-hub-test-builds/releases/latest), which
# needs the secret TEST_RELEASE_TOKEN (fine-grained token, Contents: write on
# that repository). Without it the artifacts stay in Actions only.

on:
  workflow_run:
    workflows: [Playwright]
    types: [completed]
    branches: [test]
  workflow_dispatch:
    inputs:
      desktop:
        description: Build the Core Hub Test desktop apps
        default: true
        required: false
        type: boolean
      image:
        description: Publish the test image (ghcr.io/twuijri/core-hub-test:test)
        default: true
        required: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: test-track
  cancel-in-progress: true

jobs:
  gate:
    if: github.repository == 'twuijri/core-hub' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      desktop: ${{ steps.pick.outputs.desktop }}
      image: ${{ steps.pick.outputs.image }}
    steps:
      - name: Pick the test commit
        id: pick
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha=$(gh api repos/${{ github.repository }}/branches/test --jq .commit.sha)
            echo "desktop=${{ inputs.desktop }}" >> "$GITHUB_OUTPUT"
            echo "image=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
          else
            sha="$RUN_SHA"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Test track for $sha" >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: gate
    if: needs.gate.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the rest of CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          # Playwright finishing triggered us, but the image workflow also
          # requires Build and the license guard to have succeeded on the commit.
          for attempt in $(seq 1 40); do
            pending=0
            for name in build.yml personal-license.yml; do
              state=$(gh run list --repo ${{ github.repository }} --workflow "$name" --commit "$SHA" --limit 1 --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"')
              case "$state" in
                completed/success) ;;
                completed/*) echo "::error::$name finished with ${state#completed/} on $SHA"; exit 1 ;;
                *) pending=1 ;;
              esac
            done
            [ "$pending" = 0 ] && { echo "CI is green on $SHA"; exit 0; }
            sleep 30
          done
          echo "::error::CI did not finish on $SHA in time"; exit 1
      - name: Publish the test image through the image workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run personal-image.yml --repo ${{ github.repository }} \
            -f source_ref=${{ needs.gate.outputs.sha }} \
            -f publish_latest=false \
            -f preview_tag=test \
            -f image_repo=core-hub-test
          echo "Dispatched personal-image.yml for ${{ needs.gate.outputs.sha }} → ghcr.io/twuijri/core-hub-test:test" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    needs: gate
    if: needs.gate.outputs.desktop == 'true'
    name: Core Hub Test (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-26
            target_os: darwin
            target_arch: arm64
            electron_target: "--mac dmg --arm64"
            artifact_files: |
              packages/desktop/release/*.dmg
          - label: macOS x64
            runner: macos-26-intel
            target_os: darwin
            target_arch: x64
            electron_target: "--mac dmg --x64"
            artifact_files: |
              packages/desktop/release/*.dmg
          - label: Windows x64
            runner: windows-latest
            target_os: win32
            target_arch: x64
            electron_target: "--win nsis --x64"
            artifact_files: |
              packages/desktop/release/*.exe
          - label: Linux x64
            runner: ubuntu-22.04
            target_os: linux
            target_arch: x64
            electron_target: "--linux AppImage --x64"
            artifact_files: |
              packages/desktop/release/*.AppImage
    steps:
      - name: Checkout the test commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/desktop/package-lock.json

      - name: Install web UI dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty

      - name: Build web UI
        run: npm run build

      - name: Keep production web UI dependencies only
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Verify image processing runtime
        run: npm run verify:sharp-runtime

      - name: Install desktop dependencies
        run: npm ci --prefix packages/desktop --no-audit --no-fund

      - name: Write runtime release metadata
        shell: bash
        env:
          HERMES_DESKTOP_RUNTIME_RELEASE_TAG: ${{ vars.HERMES_DESKTOP_RUNTIME_RELEASE_TAG }}
        run: npm --prefix packages/desktop run write:runtime-release

      - name: Configure macOS signing
        if: matrix.target_os == 'darwin'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node packages/desktop/scripts/configure-macos-signing.mjs

      - name: Build the Core Hub Test app
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base=$(node -p "require('./packages/desktop/package.json').version")
          version="${base}-test.${RUN_NUMBER}"
          echo "TEST_VERSION=$version" >> "$GITHUB_ENV"
          if [ "${{ matrix.target_os }}" = "darwin" ]; then ulimit -n 10240 || true; fi
          # Values with spaces do not survive npm's argument escaping on Windows,
          # so the test-channel overrides go through a config file that extends
          # the normal one instead of CLI flags.
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            fs.writeFileSync("packages/desktop/electron-builder.test.json", JSON.stringify({
              extends: "./electron-builder.yml",
              appId: "us.i3u.agentstudio.test",
              extraMetadata: { productName: "Core Hub Test", version, corehubChannel: "test" },
            }, null, 2));
          ' "$version"
          npm --prefix packages/desktop run dist -- ${{ matrix.electron_target }} ${MAC_BUILD_EXTRA_ARGS:-} --publish never --config electron-builder.test.json

      - name: Remove macOS signing keychain
        if: always() && matrix.target_os == 'darwin'
        run: node packages/desktop/scripts/configure-macos-signing.mjs --cleanup

      - name: Upload the test app (private workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          # One artifact per platform *and* architecture: the two macOS builds
          # previously shared a name, and the merged download kept only one dmg.
          name: core-hub-test-${{ matrix.target_os }}-${{ matrix.target_arch }}-${{ env.TEST_VERSION }}
          path: ${{ matrix.artifact_files }}
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish latest-test page
    needs: [gate, desktop]
    if: always() && needs.gate.outputs.desktop == 'true' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    env:
      BUILDS_REPO: twuijri/core-hub-test-builds
      RELEASE_TAG: latest-test
    steps:
      - name: Download the built apps
        uses: actions/download-artifact@v4
        with:
          path: builds
          pattern: core-hub-test-*
          merge-multiple: true

      - name: Publish to the private test-builds repository
        env:
          GH_TOKEN: ${{ secrets.TEST_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          SOURCE_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::TEST_RELEASE_TOKEN is not set; the apps stay as workflow artifacts only. Add the secret to publish them to $BUILDS_REPO."
            exit 0
          fi
          ls -la builds
          version=$(ls builds | sed -n 's/^Core\.Hub-\(.*\)-\(arm64\|x64\|x86_64\|amd64\)\..*$/\1/p' | head -1)
          [ -n "$version" ] || version="test"
          notes_file=$(mktemp)
          {
            echo "# Core Hub Test — $version"
            echo
            echo "Built from \`$SOURCE_REPO@${SOURCE_SHA}\` (test branch) on $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "- Image: \`ghcr.io/twuijri/core-hub-test:test\`"
            echo "- Source run: $RUN_URL"
            echo
            echo "Installs next to the stable Core Hub with its own data. Unsigned: on macOS use System Settings → Privacy & Security → Open Anyway."
          } > "$notes_file"
          if ! gh release view "$RELEASE_TAG" --repo "$BUILDS_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$BUILDS_REPO" --target main --title "Core Hub Test — $version" --notes-file "$notes_file"
          else
            gh release edit "$RELEASE_TAG" --repo "$BUILDS_REPO" --title "Core Hub Test — $version" --notes-file "$notes_file"
            # Replace the previous build's files so the page only ever shows the newest build.
            for asset in $(gh release view "$RELEASE_TAG" --repo "$BUILDS_REPO" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$BUILDS_REPO" --yes || true
            done
          fi
          gh release upload "$RELEASE_TAG" builds/* --repo "$BUILDS_REPO" --clobber
          echo "Published Core Hub Test $version to https://github.com/$BUILDS_REPO/releases/latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the workflow artifacts (this repository is public)
        # Actions artifacts of a public repository can be downloaded by anyone
        # who is signed in to GitHub. The private release above is the only
        # place the owner wants test builds to live, so drop the copies here
        # once they are published.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("core-hub-test-")) | .id' \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "deleted artifact $id"
            done
