name: Mobile test track

# Owner-only test builds of Core Hub Mobile from the long-lived `mobile`
# branch. Version = core package.json version + "-test.<run>", build number =
# run number (the mobile app follows the core version by owner decision).
#   * Android: unit tests + a release APK signed with the dedicated test
#     keystore (secrets ANDROID_TEST_*), so every build installs over the last.
#   * iOS: compile + unit tests on the simulator (no Apple signing yet) and an
#     unsigned .ipa for sideloading.
#   * Both published to the private repository twuijri/core-hub-test-builds as
#     the rolling release `latest-test-mobile`; public artifacts are removed.

on:
  push:
    branches: [mobile]
    paths:
      - 'clients/**'
      - '.github/workflows/mobile-test-track.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mobile-test-track
  cancel-in-progress: true

env:
  BUILDS_REPO: twuijri/core-hub-test-builds
  RELEASE_TAG: latest-test-mobile

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          core=$(node -p "require('./package.json').version")
          echo "name=${core}-test.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Core Hub Mobile ${core}-test.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      CORE_HUB_VERSION_NAME: ${{ needs.version.outputs.name }}
      CORE_HUB_VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Restore the test signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/corehub-test.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/corehub-test.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_TEST_KEYSTORE_B64 is not set; the APK will use a throwaway debug key and will not install over previous builds."
          fi
      - name: Unit tests and release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
        run: |
          gradle -p clients/android --no-daemon testDebugUnitTest assembleRelease
          mkdir -p out
          cp clients/android/app/build/outputs/apk/release/*.apk "out/Core.Hub.Mobile-${CORE_HUB_VERSION_NAME}-android.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: core-hub-mobile-android-${{ needs.version.outputs.name }}
          path: out/*.apk
          retention-days: 7
          if-no-files-found: error

  ios:
    needs: version
    runs-on: macos-latest
    env:
      MARKETING_VERSION: ${{ needs.version.outputs.name }}
      CURRENT_PROJECT_VERSION: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run unit tests on the simulator
        run: |
          set -o pipefail
          # Keep the full log as an artifact-friendly file and print every
          # compiler error (not just the last lines) so failures are readable.
          xcodebuild -project clients/ios/HermesStudio.xcodeproj -scheme HermesStudio \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            build > "$RUNNER_TEMP/xcodebuild-build.log" 2>&1 || {
              echo "::group::xcodebuild errors"; grep -E "error:|BUILD FAILED" "$RUNNER_TEMP/xcodebuild-build.log" | sort -u | head -80; echo "::endgroup::"
              tail -60 "$RUNNER_TEMP/xcodebuild-build.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/xcodebuild-build.log"
          dest=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z ]+ \(' | sed 's/ ($//')
          xcodebuild -project clients/ios/HermesStudio.xcodeproj -scheme HermesStudio \
            -sdk iphonesimulator -destination "platform=iOS Simulator,name=${dest:-iPhone 16}" \
            CODE_SIGNING_ALLOWED=NO -resultBundlePath "$RUNNER_TEMP/tests.xcresult" test > "$RUNNER_TEMP/xcodebuild-test.log" 2>&1 || {
              echo "::group::xcodebuild test failures"; grep -E "error:|failed on|XCTAssert|TEST FAILED" "$RUNNER_TEMP/xcodebuild-test.log" | sort -u | head -80; echo "::endgroup::"
              # Recent Xcode releases keep the assertion message only inside the
              # result bundle, so print it from there as well.
              echo "::group::assertion messages"; xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/tests.xcresult" 2>/dev/null \
                | python3 -c 'import json,sys
def walk(n):
    if isinstance(n, dict):
        if n.get("result") == "Failed" and n.get("nodeType") in ("Test Case","Failure Message"):
            print(n.get("nodeType"), ":", n.get("name"))
        for v in n.values(): walk(v)
    elif isinstance(n, list):
        for v in n: walk(v)
walk(json.load(sys.stdin))' 2>/dev/null | head -80; echo "::endgroup::"
              tail -60 "$RUNNER_TEMP/xcodebuild-test.log"; exit 1; }
          grep -E "Executed [0-9]+ tests" "$RUNNER_TEMP/xcodebuild-test.log" | tail -1
      - name: Unsigned .ipa for sideloading
        run: |
          set -o pipefail
          xcodebuild -project clients/ios/HermesStudio.xcodeproj -scheme HermesStudio -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CoreHubMobile.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            archive | tail -20
          mkdir -p "$RUNNER_TEMP/Payload" out
          cp -R "$RUNNER_TEMP/CoreHubMobile.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/out/Core.Hub.Mobile-${MARKETING_VERSION}-ios-unsigned.ipa" Payload)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: core-hub-mobile-ios-${{ needs.version.outputs.name }}
          path: out/*.ipa
          retention-days: 7
          if-no-files-found: error

  # Signed iOS build uploaded to TestFlight. Runs only when the Apple secrets
  # exist (IOS_CSC_LINK/IOS_CSC_KEY_PASSWORD, APPLE_TEAM_ID, ASC_API_KEY_P8/ID/
  # ISSUER_ID); otherwise it is skipped with a notice. Signing is automatic via
  # the App Store Connect API key (-allowProvisioningUpdates), so no manual
  # provisioning profiles are needed.
  testflight:
    needs: [version, ios]
    if: needs.ios.result == 'success'
    runs-on: macos-latest
    env:
      MARKETING_VERSION: ${{ needs.version.outputs.name }}
      CURRENT_PROJECT_VERSION: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Apple secrets
        id: secrets
        env:
          IOS_CSC_LINK: ${{ secrets.IOS_CSC_LINK }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$IOS_CSC_LINK" ] || [ -z "$ASC_API_KEY_P8" ] || [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::TestFlight upload skipped: IOS_CSC_LINK, ASC_API_KEY_P8, ASC_API_KEY_ID, ASC_API_ISSUER_ID and APPLE_TEAM_ID are all required."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Import the distribution certificate and API key
        if: steps.secrets.outputs.ready == 'true'
        env:
          IOS_CSC_LINK: ${{ secrets.IOS_CSC_LINK }}
          IOS_CSC_KEY_PASSWORD: ${{ secrets.IOS_CSC_KEY_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/corehub-ios.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$IOS_CSC_LINK" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/[0-9A-F]\{40\}/<hash>/' | head -3
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_API_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Archive, sign and upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          ARCHIVE="$RUNNER_TEMP/CoreHubMobile-signed.xcarchive"
          xcodebuild -project clients/ios/HermesStudio.xcodeproj -scheme HermesStudio -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E "error:|BUILD FAILED" "$RUNNER_TEMP/archive.log" | sort -u | head -40; tail -40 "$RUNNER_TEMP/archive.log"; exit 1; }
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { grep -E "error:|Error" "$RUNNER_TEMP/export.log" | sort -u | head -40; tail -40 "$RUNNER_TEMP/export.log"; exit 1; }
          grep -E "EXPORT SUCCEEDED|Upload|uploaded" "$RUNNER_TEMP/export.log" | tail -3
          echo "Uploaded Core Hub Mobile $MARKETING_VERSION (build $CURRENT_PROJECT_VERSION) to TestFlight" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the signing keychain and API key
        if: always()
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/dist.p12"

  publish:
    needs: [version, android, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          pattern: core-hub-mobile-*
          merge-multiple: true
      - name: Publish to the private test-builds repository
        env:
          GH_TOKEN: ${{ secrets.TEST_RELEASE_TOKEN }}
          VERSION: ${{ needs.version.outputs.name }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::TEST_RELEASE_TOKEN is not set; builds stay as workflow artifacts only."
            exit 0
          fi
          ls -la builds
          notes=$(mktemp)
          {
            echo "# Core Hub Mobile — $VERSION"
            echo
            echo "Built from \`${{ github.repository }}@${SOURCE_SHA}\` (mobile branch) on $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "- Android: signed with the test key; installs over previous test builds."
            echo "- iOS: ${IOS_RESULT} — unsigned .ipa (sideload with your Apple ID) until TestFlight is set up."
            echo "- Source run: $RUN_URL"
          } > "$notes"
          if ! gh release view "$RELEASE_TAG" --repo "$BUILDS_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$BUILDS_REPO" --target main --title "Core Hub Mobile — $VERSION" --notes-file "$notes"
          else
            gh release edit "$RELEASE_TAG" --repo "$BUILDS_REPO" --title "Core Hub Mobile — $VERSION" --notes-file "$notes"
            for asset in $(gh release view "$RELEASE_TAG" --repo "$BUILDS_REPO" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$BUILDS_REPO" --yes || true
            done
          fi
          gh release upload "$RELEASE_TAG" builds/* --repo "$BUILDS_REPO" --clobber
          echo "Published Core Hub Mobile $VERSION to https://github.com/$BUILDS_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the public workflow artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("core-hub-mobile-")) | .id' \
          | while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "deleted artifact $id"; done
